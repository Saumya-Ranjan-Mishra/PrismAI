spring.application.name=PrismAI
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.open-in-view=false

prism.embedding.tokenizer-resource=file:${user.home}/Downloads/tokenizer.json
prism.embedding.model-resource=file:${user.home}/Downloads/model.onnx

prism.embedding.quantized-tokenizer-resource=file:${user.home}/Downloads/tokenizer.json
prism.embedding.quantized-model-resource=file:${user.home}/Downloads/model.onnx

spring.data.redis.host=localhost
spring.data.redis.port=6379
